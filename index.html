<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>이동 보고</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2f80ed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --danger: #e5484d;
    --line: color-mix(in srgb, var(--hint) 28%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 14px/1.35 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  header { padding: 12px 14px 4px; display: flex; align-items: baseline; gap: 8px; }
  header h1 { margin: 0; font-size: 17px; }
  header span { color: var(--hint); font-size: 12px; }

  /* 입력 상자 (항상 한 개) */
  .entry { position: sticky; top: 0; z-index: 10; background: var(--bg); margin: 6px 10px; padding: 10px;
    border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .grid { display: grid; gap: 6px; margin-bottom: 6px; }
  .g1 { grid-template-columns: 1fr; }
  .g-name { grid-template-columns: 1fr 1.5fr; }
  .g-zone { grid-template-columns: 1fr auto 1fr; align-items: center; }
  .arrow { color: var(--hint); font-size: 16px; }
  .g-move { grid-template-columns: 1.6fr 1fr; }
  .f { position: relative; }
  .f input { width: 100%; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--bg2); color: var(--text); outline: none; }
  .f input::placeholder { color: var(--hint); }
  .f input:focus { border-color: var(--accent); }
  .f.bad input { border-color: var(--danger); }
  .msg { color: var(--danger); font-size: 12px; min-height: 16px; margin: -2px 2px 4px; }
  .add { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: color-mix(in srgb, var(--accent) 14%, transparent);
    color: var(--accent); font-size: 15px; font-weight: 700; cursor: pointer; }

  .dropdown { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; margin-top: 3px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.16);
    max-height: 210px; overflow-y: auto; }
  .dropdown div { padding: 9px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .dropdown div:last-child { border-bottom: 0; }
  .dropdown div:active { background: var(--bg2); }
  .dropdown mark { background: none; color: var(--accent); font-weight: 700; }
  .dropdown .empty { color: var(--hint); cursor: default; }

  /* 추가된 사람 목록: 한 줄에 한 명 */
  .list-head { padding: 8px 16px 4px; font-size: 12px; color: var(--hint); display: flex; justify-content: space-between; }
  ul { list-style: none; margin: 0 10px 110px; padding: 0; background: var(--bg); border-radius: 12px; overflow: hidden; }
  ul:empty::before { content: "위에서 입력하고 [추가]를 누르면 여기에 쌓입니다."; display: block; padding: 14px;
    color: var(--hint); font-size: 13px; text-align: center; }
  li { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 12px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li .n { color: var(--hint); font-size: 12px; width: 18px; }
  li .body { flex: 1; min-width: 0; cursor: pointer; }
  li .top { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .sub { font-size: 12px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .x { border: 0; background: none; color: var(--hint); font-size: 18px; padding: 2px 6px; cursor: pointer; }

  footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line); }
  .submit { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent);
    color: var(--accent-text); font-size: 16px; font-weight: 700; cursor: pointer; }
  .submit:disabled { opacity: .4; }
  .notice { margin: 30px 14px; padding: 14px; background: var(--bg); border-radius: 12px; }
</style>
</head>
<body>
<header><h1 id="title"></h1><span id="sub"></span></header>

<section class="entry" id="entry">
  <div class="grid g1"><div class="f"><input id="dept" placeholder="부서 (예: 필승)" autocomplete="off" enterkeyhint="next"></div></div>
  <div class="grid g-name">
    <div class="f"><input id="name" placeholder="이름" autocomplete="off" enterkeyhint="next"></div>
    <div class="f"><input id="uid" placeholder="00000000-00000" inputmode="numeric" autocomplete="off" enterkeyhint="next"></div>
  </div>
  <div class="grid" id="row3"></div>
  <div class="msg" id="msg"></div>
  <button class="add" id="add">+ 추가</button>
</section>

<div class="list-head"><span id="count">추가된 인원 0명</span><span>누르면 수정</span></div>
<ul id="list"></ul>

<footer id="footer"><button class="submit" id="submit" disabled>등록하기</button></footer>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ---- 봇이 주소에 담아 보낸 정보: f=양식(1|2), d=부서목록(base64url), e=마감 ----
const params = new URLSearchParams(location.search);
const FORM = params.get("f") === "2" ? 2 : 1;
function b64decode(s) {
  s = (s || "").replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  try { return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); }
  catch (e) { return ""; }
}
const DEPTS = b64decode(params.get("d")).split("\n").map(s => s.trim()).filter(Boolean);
const DEPT_SET = new Set(DEPTS);
const MAX_ROWS = 40;
const $ = id => document.getElementById(id);

$("title").textContent = FORM === 1 ? "구역이동 보고" : "부서이동 보고";
$("sub").textContent = params.get("e") ? "마감 " + params.get("e") : "";

// 셋째 줄: 양식1 = 현재구역|이동구역, 양식2 = 이동부서|이동구역(선택)
$("row3").className = "grid " + (FORM === 1 ? "g-zone" : "g-move");
$("row3").innerHTML = FORM === 1
  ? '<div class="f"><input id="cur" placeholder="현재구역" inputmode="numeric" autocomplete="off" enterkeyhint="next"></div>' +
    '<span class="arrow">→</span><div class="f"><input id="move" placeholder="이동구역" inputmode="numeric" autocomplete="off" enterkeyhint="done"></div>'
  : '<div class="f"><input id="mdept" placeholder="이동부서" autocomplete="off" enterkeyhint="next"></div>' +
    '<div class="f"><input id="move" placeholder="이동구역(선택)" inputmode="numeric" autocomplete="off" enterkeyhint="done"></div>';

if (!DEPTS.length) {
  document.body.innerHTML = '<div class="notice">부서 목록을 불러오지 못했습니다.<br>봇 채팅방에서 보고 버튼을 다시 눌러 주세요.</div>';
  throw new Error("no depts");
}

const KEYS = FORM === 1 ? ["dept", "name", "uid", "cur", "move"] : ["dept", "name", "uid", "mdept", "move"];
const LABEL = { dept: "부서", name: "이름", uid: "고유번호", cur: "현재구역", mdept: "이동부서", move: "이동구역" };
const input = Object.fromEntries(KEYS.map(k => [k, $(k)]));

// ---- 검사: 틀린 칸 이름과 이유 ----
function problem(k, v) {
  v = v.trim();
  if (!v) return k === "move" && FORM === 2 ? "" : `${LABEL[k]}을(를) 입력하세요`;
  if (k === "dept" || k === "mdept") return DEPT_SET.has(v) ? "" : `${LABEL[k]}는 목록에서 골라 주세요`;
  if (k === "name") return v.includes("/") ? "이름에 '/' 는 쓸 수 없습니다" : "";
  if (k === "uid") {
    if (/^\d{8}-\d{5}$/.test(v)) return "";
    return `고유번호는 숫자 13자리입니다 (지금 ${v.replace(/\D/g, "").length}자리)`;
  }
  return /^\d+$/.test(v) ? "" : `${LABEL[k]}는 숫자만 입력하세요`;
}

function checkEntry(showAll) {
  let first = null;
  for (const k of KEYS) {
    const p = problem(k, input[k].value);
    const show = showAll || input[k].dataset.touched;
    input[k].parentElement.classList.toggle("bad", !!(p && show));
    if (p && show && !first) first = { k, p };
  }
  $("msg").textContent = first ? first.p : "";
  return first;
}

// ---- 자동 서식 ----
input.uid.addEventListener("input", () => {
  const d = input.uid.value.replace(/\D/g, "").slice(0, 13);
  input.uid.value = d.length > 8 ? d.slice(0, 8) + "-" + d.slice(8) : d;
  if (d.length === 13) { input.uid.dataset.touched = 1; focusNext("uid"); }
  checkEntry();
});
for (const k of ["cur", "move"]) if (input[k])
  input[k].addEventListener("input", () => { input[k].value = input[k].value.replace(/\D/g, ""); checkEntry(); });
input.name.addEventListener("input", () => checkEntry());
for (const k of KEYS) input[k].addEventListener("blur", () => { input[k].dataset.touched = 1; setTimeout(() => checkEntry(), 0); });

function focusNext(k) {
  const i = KEYS.indexOf(k);
  if (i < KEYS.length - 1) input[KEYS[i + 1]].focus();
  else addPerson();
}
for (const k of KEYS) input[k].addEventListener("keydown", e => {
  if (e.key === "Enter" && !(openDrop && (k === "dept" || k === "mdept"))) { e.preventDefault(); focusNext(k); }
});

// ---- 부서 자동완성 ----
const norm = s => s.replace(/\s+/g, "").toLowerCase();
function matches(q) {
  const n = norm(q);
  if (!n) return DEPTS.slice(0, 40);
  const a = [], b = [];
  for (const d of DEPTS) { const i = norm(d).indexOf(n); if (i === 0) a.push(d); else if (i > 0) b.push(d); }
  return a.concat(b).slice(0, 40);
}
function highlight(d, q) {
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const n = q.replace(/\s+/g, ""), i = n ? d.indexOf(n) : -1;
  return i < 0 ? esc(d) : esc(d.slice(0, i)) + "<mark>" + esc(d.slice(i, i + n.length)) + "</mark>" + esc(d.slice(i + n.length));
}
let openDrop = null;
const closeDrop = () => { if (openDrop) { openDrop.remove(); openDrop = null; } };
document.addEventListener("pointerdown", e => { if (openDrop && !openDrop.parentElement.contains(e.target)) closeDrop(); });

for (const k of ["dept", "mdept"]) if (input[k]) {
  const el = input[k];
  const pick = d => { el.value = d; closeDrop(); el.dataset.touched = 1; checkEntry(); focusNext(k); };
  const show = () => {
    closeDrop();
    const drop = document.createElement("div");
    drop.className = "dropdown";
    const list = matches(el.value);
    if (!list.length) drop.innerHTML = '<div class="empty">일치하는 부서가 없습니다</div>';
    for (const d of list) {
      const item = document.createElement("div");
      item.innerHTML = highlight(d, el.value);
      item.addEventListener("pointerdown", e => { e.preventDefault(); pick(d); });
      drop.appendChild(item);
    }
    el.parentElement.appendChild(drop);
    openDrop = drop;
  };
  el.addEventListener("focus", show);
  el.addEventListener("input", () => { show(); checkEntry(); });
  el.addEventListener("keydown", e => {
    if (e.key === "Enter" && openDrop) { e.preventDefault(); const m = matches(el.value)[0]; if (m) pick(m); }
  });
}

// ---- 목록 ----
let people = [];
function values() { return Object.fromEntries(KEYS.map(k => [k, input[k].value.trim()])); }
function entryEmpty() { return KEYS.filter(k => k !== "dept").every(k => !input[k].value.trim()); }

function addPerson() {
  const bad = checkEntry(true);
  if (bad) { input[bad.k].focus(); haptic("error"); return false; }
  if (people.length >= MAX_ROWS) { $("msg").textContent = `한 번에 ${MAX_ROWS}명까지 보낼 수 있습니다`; return false; }
  const v = values();
  if (people.some(p => p.uid === v.uid)) { $("msg").textContent = "이미 목록에 있는 고유번호입니다"; input.uid.focus(); return false; }
  people.push(v);
  // 부서는 그대로 두고 나머지만 비운다 (같은 부서 여러 명 입력이 빠르도록)
  for (const k of KEYS) if (k !== "dept") { input[k].value = ""; delete input[k].dataset.touched; }
  checkEntry();
  render();
  input.name.focus();
  haptic("success");
  return true;
}
$("add").addEventListener("click", addPerson);

function render() {
  const ul = $("list");
  ul.innerHTML = "";
  people.forEach((p, i) => {
    const li = document.createElement("li");
    const detail = FORM === 1 ? `${p.cur}구역 → ${p.move}구역` : `→ ${p.mdept}${p.move ? " " + p.move + "구역" : " (구역 미정)"}`;
    li.innerHTML = `<span class="n">${i + 1}</span><div class="body"><div class="top"></div><div class="sub"></div></div><button class="x" aria-label="삭제">✕</button>`;
    li.querySelector(".top").textContent = FORM === 1 ? `${p.name} · ${detail}` : `${p.name} ${detail}`;
    li.querySelector(".sub").textContent = `${p.dept} · ${p.uid}`;
    li.querySelector(".x").addEventListener("click", () => { people.splice(i, 1); render(); });
    li.querySelector(".body").addEventListener("click", () => {   // 수정: 입력 상자로 되돌린다
      if (!entryEmpty() && !confirm("입력 중인 내용이 지워집니다. 이 사람을 수정할까요?")) return;
      people.splice(i, 1);
      for (const k of KEYS) { input[k].value = p[k] || ""; input[k].dataset.touched = 1; }
      checkEntry(); render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      input.name.focus();
    });
    ul.appendChild(li);
  });
  $("count").textContent = `추가된 인원 ${people.length}명`;
  $("submit").disabled = !people.length && entryEmpty();
  $("submit").textContent = people.length ? `${people.length}명 등록하기` : "등록하기";
}

function haptic(t) { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(t); }
for (const k of KEYS) input[k].addEventListener("input", render);

// ---- 전송 ----
function toLine(p) {
  return FORM === 1 ? [p.dept, p.name, p.uid, p.cur, p.move].join("/")
                    : [p.dept, p.name, p.uid, p.mdept].concat(p.move ? [p.move] : []).join("/");
}
$("submit").addEventListener("click", () => {
  // 입력 상자에 쓰다 만 사람이 있으면 먼저 목록에 넣는다
  if (!entryEmpty() && !addPerson()) return;
  if (!people.length) return;
  const payload = JSON.stringify({ f: FORM, t: people.map(toLine).join("\n") });
  if (new TextEncoder().encode(payload).length > 4000) { $("msg").textContent = "너무 많습니다. 나눠서 보내 주세요."; return; }
  if (tg && tg.initData) tg.sendData(payload);   // 봇 채팅방으로 전달되고 창이 닫힌다
  else alert("텔레그램 밖에서 연 테스트 화면입니다.\n\n보낼 내용:\n" + people.map(toLine).join("\n"));
});

render();
</script>
</body>
</html>
